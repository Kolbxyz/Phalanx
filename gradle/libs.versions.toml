[versions]
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.11"
hilt = "2.60.1"
kover = "0.9.11"
# 2.0 is still alpha. alpha.3 is the last one built against Kotlin 2.3.x, which this project is on.
detekt = "2.0.0-alpha.3"
androidxHilt = "1.4.0"

coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
# The alpha is what ships the Expressive APIs (ButtonGroup, LoadingIndicator, wavy progress, ...).
material3 = "1.5.0-alpha26"
material3Adaptive = "1.3.0"
navigationCompose = "2.9.8"
browser = "1.10.0"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"
coil = "3.5.0"
# Scheduled messages: survives reboots, waits for network, retries with backoff. AOSP, no Play Services.
work = "2.11.2"
# UnifiedPush (no FCM): Apache-2.0, run by the UnifiedPush project, the connector Element X ships. Its
# Tink dependency is a pure crypto library (WebPush decryption), not Play Services.
unifiedpush = "3.3.5"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
# Custom Tabs for OAuth sign-in: the server's page opens in the user's browser, not a WebView.
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Strict: the bindings change API between releases, so it is only ever bumped on purpose.
matrix-rust-sdk = { module = "org.matrix.rustcomponents:sdk-android", version = { strictly = "26.10.20" } }
# The Java half of the SDK's TLS verifier; its version follows what Element X ships with the SDK above.
rustls-platform-verifier = { module = "org.rustls:rustls-platform-verifier", version = "0.2.0" }

# Apache-2.0 image loader with memory and disk caches, the one Element X uses. Fed through an SDK fetcher
# (core/media), so encrypted media is decrypted by the SDK and no network stack is added.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
