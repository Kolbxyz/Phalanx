name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # llama.cpp, built into the app, is a submodule.
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Kotlin Style (ktlint)
        run: |
          curl -sSLo ktlint https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  ktlint" | sha256sum -c -
          chmod +x ktlint
          ./ktlint --relative "app/src/**/*.kt"

      # llama.cpp is the slowest part of the build: ccache reuses its objects across runs. CMake
      # picks the launcher up from these variables, which Gradle passes through to it.
      - name: Set up ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      # One Gradle invocation, so independent tasks run in parallel and the APK reuses the
      # compilation already done for tests and lint.
      - name: Detekt, Unit Tests, Coverage, Lint & Debug APK
        run: |
          ./gradlew :app:detekt :app:testDebugUnitTest :app:koverVerifyDebug :app:lintDebug \
            :app:assembleDebug --continue || {
            report=app/build/reports/lint-results-debug.txt
            if [ -f "$report" ]; then
              echo "=== $report ==="
              cat "$report"
            fi
            exit 1
          }

      # Skipped when an earlier step failed before ccache was installed, which would hide that failure.
      - name: ccache Stats
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-stats
